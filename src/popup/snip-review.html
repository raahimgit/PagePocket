<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snip review · PagePocket</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="snip-review.css">
</head>
<body>
  <header class="review-header">
    <a class="review-brand" href="#" aria-label="PagePocket">
      <span class="brand-mark" aria-hidden="true"></span><span>PagePocket</span>
    </a>
    <button id="open-library" type="button">Open library</button>
  </header>
  <main class="review">
    <div class="review-heading">
      <div><p class="eyebrow">Snip saved</p><h1>Text from your snip</h1><p class="muted">Review and correct the text, then save it as a searchable excerpt.</p></div>
      <p id="status" role="status" aria-live="polite" class="status-pill">Loading snip…</p>
    </div>
    <p id="source" class="source-line"></p>
    <div class="review-grid">
      <figure class="preview-card"><img id="preview" alt="Your saved snip"><figcaption>Captured area</figcaption></figure>
      <section id="ocr-result" class="text-card" hidden aria-labelledby="text-heading">
        <div class="text-card-heading"><div><p class="eyebrow">Recognized text</p><h2 id="text-heading">Check the result</h2></div><span class="local-pill">Processed on this device</span></div>
        <label class="sr-only" for="ocr-text">Review or edit recognized English text</label>
        <textarea id="ocr-text" rows="18" maxlength="10000" disabled></textarea>
        <div class="text-actions"><button id="save-text" class="primary-button" type="button" disabled>Save extracted text</button></div>
      </section>
    </div>
  </main>
  <script src="snipReview.js"></script>
</body>
</html>
