<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extract text from snip · ContextLens</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="snip-review.css">
</head>
<body>
  <main class="review">
    <h1>Extract text from snip</h1>
    <p id="status" role="status" aria-live="polite">Loading snip…</p>
    <p id="source"></p>
    <img id="preview" alt="Your saved snip">
    <label for="ocr-text">Review and edit recognized English text</label>
    <textarea id="ocr-text" rows="14" maxlength="100000" disabled></textarea>
    <div class="actions"><button id="save-text" type="button" disabled>Save extracted text</button><button id="open-library" type="button">Open library</button></div>
  </main>
  <script src="snipReview.js"></script>
</body>
</html>
